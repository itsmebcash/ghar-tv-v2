name: Build APK

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # One permanent key for Ghar TV and Ghar Launcher (GitHub secret), so updates install
      # over the top and the two apps can trust each other.
      - name: Prepare signing key
        env:
          GHAR_KEYSTORE_B64: ${{ secrets.GHAR_KEYSTORE_B64 }}
        run: |
          if [ -n "$GHAR_KEYSTORE_B64" ]; then
            echo "$GHAR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ghar.keystore"
            echo "GHAR_KEYSTORE_FILE=$RUNNER_TEMP/ghar.keystore" >> "$GITHUB_ENV"
            echo "Signing with the shared Ghar key"
          else
            echo "::warning::GHAR_KEYSTORE_B64 secret is not set - this APK uses a temporary key and cannot talk to Ghar Launcher"
          fi

      # The Android SDK is preinstalled on GitHub's ubuntu runners (ANDROID_HOME)
      - name: Build debug APK
        env:
          GHAR_KEY_PASSWORD: ${{ secrets.GHAR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: GharTV-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # A download link that always has the newest build: Releases -> latest -> GharTV.apk
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GharTV.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Built automatically from main. Install GharTV.apk on the TV."
          gh release upload latest GharTV.apk --clobber
