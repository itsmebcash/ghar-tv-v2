plugins {
    id 'com.android.application'
}

// Shared signing key (same as Ghar Launcher), provided by the GitHub secret GHAR_KEYSTORE_B64.
// Without it the build still works, signed with a temporary debug key.
def gharKeystore = System.getenv('GHAR_KEYSTORE_FILE')
def useGharKey = gharKeystore != null && new File(gharKeystore).exists()

android {
    namespace 'com.ghar.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ghar.tv'
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName '2.7'
    }

    signingConfigs {
        ghar {
            if (useGharKey) {
                storeFile file(gharKeystore)
                storePassword System.getenv('GHAR_KEY_PASSWORD')
                keyAlias 'ghar'
                keyPassword System.getenv('GHAR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (useGharKey) signingConfig signingConfigs.ghar
        }
        release {
            minifyEnabled false
            if (useGharKey) signingConfig signingConfigs.ghar
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Google's Media3 (ExoPlayer): the standard player for live HLS streams on Android TV
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
}
