plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Shared signing key (same as Ghar Launcher), provided by the GitHub secret GHAR_KEYSTORE_B64.
// Without it the build still works, signed with a temporary debug key.
def gharKeystore = System.getenv('GHAR_KEYSTORE_FILE')
def useGharKey = gharKeystore != null && new File(gharKeystore).exists()

android {
    namespace 'com.ghar.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ghar.tv'
        minSdk 21
        targetSdk 34
        versionCode 33
        versionName '4.2'
    }

    signingConfigs {
        ghar {
            if (useGharKey) {
                storeFile file(gharKeystore)
                storePassword System.getenv('GHAR_KEY_PASSWORD')
                keyAlias 'ghar'
                keyPassword System.getenv('GHAR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (useGharKey) signingConfig signingConfigs.ghar
        }
        release {
            minifyEnabled false
            if (useGharKey) signingConfig signingConfigs.ghar
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Google's Media3 (ExoPlayer): the standard player for live HLS streams on Android TV
    def media3 = '1.5.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // Ghar Player (music from Bcash Player on the phone, and FM): background playback and its cache
    implementation "androidx.media3:media3-session:$media3"
    implementation "androidx.media3:media3-datasource:$media3"
    implementation "androidx.media3:media3-database:$media3"
    implementation "androidx.media3:media3-extractor:$media3"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.zxing:core:3.5.3'
    // Faster connections (reused, HTTP/2) for the streams
    implementation "androidx.media3:media3-datasource-okhttp:$media3"
    // Sound formats the TV can't decode itself (MP2, AC-3, E-AC-3, DTS) - FFmpeg build by Jellyfin
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1'
}
